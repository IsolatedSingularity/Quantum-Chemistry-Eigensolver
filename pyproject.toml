[build-system]
requires = ["setuptools >= 68.0", "wheel"]

[tool.setuptools.packages.find]
include = ["quantum_chemistry*"]

[project]
name = "quantum-chemistry-eigensolver"
version = "0.1.0"
description = "Variational Quantum Eigensolver for molecular ground-state energy simulation"
authors = [{ name = "Jeffrey Morais" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "qiskit>=2.0",
    "qiskit-aer>=0.17",
    "qiskit-ibm-runtime>=0.38",
    "matplotlib>=3.9",
    "pylatexenc>=2.10",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
qce-dissociation = "quantum_chemistry.cli:dissociation"
qce-visualize = "quantum_chemistry.cli:visualize"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"