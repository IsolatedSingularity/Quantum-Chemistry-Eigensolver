[build-system]
requires = ["setuptools >= 68.0", "wheel"]

[tool.setuptools.packages.find]
include = ["quantum_chemistry*"]

[project]
name = "quantum-chemistry-eigensolver"
version = "0.1.0"
description = "VQE for H2 dissociation with Jordan-Wigner mapping, built from scratch on Qiskit 2.0"
authors = [{ name = "Jeffrey Morais" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<4"
keywords = ["quantum", "chemistry", "vqe", "jordan-wigner", "qiskit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.13,<2",
    "qiskit>=2.0,<3",
    "qiskit-aer>=0.17,<1",
    "qiskit-ibm-runtime>=0.38,<1",
    "matplotlib>=3.9,<4",
    "pylatexenc>=2.10,<3",
    "seaborn>=0.13,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<6",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
]
generate = [
    "pyscf>=2.6,<3",
    "rustworkx>=0.15,<1",
]

[project.urls]
Repository = "https://github.com/IsolatedSingularity/Quantum-Chemistry-Eigensolver"
Homepage = "https://ichor.pages.dev/"

[project.scripts]
qce-dissociation = "quantum_chemistry.cli:dissociation"
qce-visualize = "quantum_chemistry.cli:visualize"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: tests that run quantum simulations (deselect with '-m \"not slow\"')",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["quantum_chemistry"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING",
]